[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [
    {"regex_pattern":"blk_-?\\d+", "mask_with": "BLK"},
    {"regex_pattern":"(\\d+\\.){3}\\d+(:\\d+)?", "mask_with": "IP"},
    {"regex_pattern":"/[\\w./-]+", "mask_with": "PATH"},
    {"regex_pattern":"\\b\\d+\\b", "mask_with": "NUM"}
    ]

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100