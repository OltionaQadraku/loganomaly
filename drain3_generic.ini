[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [
    {"regex_pattern":"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "mask_with": "UUID"},
    {"regex_pattern":"(\\d+\\.){3}\\d+(:\\d+)?", "mask_with": "IP"},
    {"regex_pattern":"0x[0-9a-fA-F]+", "mask_with": "HEX"},
    {"regex_pattern":"/[\\w./-]+", "mask_with": "PATH"},
    {"regex_pattern":"\\b\\d+(\\.\\d+)?(ms|s|m|h)\\b", "mask_with": "DURATION"},
    {"regex_pattern":"\\b\\d+\\b", "mask_with": "NUM"}
    ]

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
